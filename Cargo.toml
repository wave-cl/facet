[workspace]
resolver = "2"
members = [
    "crates/facet",
    "crates/facet-proto",
    "crates/facet-client",
    "crates/facetd",
    "crates/facet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/wave-cl/facet"

[workspace.dependencies]
# The library publishes as `facet-db` (the crates.io name `facet` is a
# reflection crate); its library target is `facet`, so code says `use facet::`.
facet = { package = "facet-db", path = "crates/facet", version = "0.1.0" }
facet-proto = { path = "crates/facet-proto", version = "0.1.0" }
facet-client = { path = "crates/facet-client", version = "0.1.0" }
facetd = { path = "crates/facetd", version = "0.1.0" }

redb = "4"
uuid = "1"
bytes = "1"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
crc32fast = "1"
thiserror = "2"
anyhow = "1"
# No features here on purpose: `workspace = true` can only add features,
# and the library must pull in nothing beyond `sync`.
tokio = "1"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
futures = "0.3"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower = "0.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
prometheus = { version = "0.14", default-features = false }
subtle = "2"
http = "1"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chron-client = "0.7"
chrond = "0.7"
chron-proto = "0.7"
proptest = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
