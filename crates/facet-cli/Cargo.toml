[package]
name = "facet-cli"
description = "facet: the command-line client for a facetd daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["event-sourcing", "cqrs", "projections", "cli", "grpc"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "facet"
path = "src/main.rs"
# The binary shares the library's name; only the library is documented.
doc = false

[dependencies]
facet-client = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
facet = { workspace = true }
facetd = { workspace = true, features = ["test-util"] }
chron-client = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
