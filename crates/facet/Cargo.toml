[package]
name = "facet-db"
description = "Projection database over chron: sets, maps, lists, tables, sorted sets and time buckets kept by Rust projections over an event log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/facet-db"
keywords = ["event-sourcing", "cqrs", "projections", "read-model", "database"]
categories = ["database-implementations"]

# The crates.io name `facet` is taken; the library target keeps the name
# so code says `use facet::`.
[lib]
name = "facet"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["runtime"]
# The projection SDK and the runtime that tails chron; without it the
# crate is the engine alone.
runtime = [
    "dep:chron-client",
    "dep:futures",
    "dep:crc32fast",
    "dep:tokio-util",
    "dep:tracing",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/time",
]

[dependencies]
redb = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
bytes = { workspace = true, features = ["serde"] }
rust_decimal = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
chron-client = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
chrond = { workspace = true, features = ["test-util"] }
chron-client = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
futures = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"

[[test]]
name = "runtime"
path = "tests/runtime/main.rs"
required-features = ["runtime"]

[[bench]]
name = "facet"
harness = false
