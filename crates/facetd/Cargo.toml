[package]
name = "facetd"
description = "facet: the daemon serving an application's projections over gRPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/facetd"
keywords = ["event-sourcing", "cqrs", "projections", "grpc", "read-model"]
categories = ["database-implementations"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
facet = { workspace = true }
facet-proto = { workspace = true }
chron-client = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
pin-project-lite = { workspace = true }
prometheus = { workspace = true }
subtle = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
uuid = { workspace = true }
chrond = { workspace = true, features = ["test-util"], optional = true }
tempfile = { workspace = true, optional = true }

[features]
# An in-process chrond + facetd fixture and certificates for tests:
# `facetd::testing`.
test-util = ["dep:chrond", "dep:tempfile"]

[dev-dependencies]
facet-client = { workspace = true }
chrond = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
futures = { workspace = true }
rust_decimal = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
required-features = ["test-util"]
