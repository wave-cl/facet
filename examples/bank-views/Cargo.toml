[package]
name = "bank-views"
description = "facet example: projections over chron's bank example, served by an embedded facetd"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bank-views"
path = "src/main.rs"

[dependencies]
facet = { workspace = true }
facetd = { workspace = true }
chron-client = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
facetd = { workspace = true, features = ["test-util"] }
facet-client = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
